<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Keeper WebAR Multi-Target Scanner</title>
  
  <!-- Include A-Frame (v1.5.0) and MindAR A-Frame Library -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background-color: #000;
      font-family: sans-serif;
    }
    #loading-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #2D241E;
      color: #F5F2E9;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      transition: opacity 0.5s ease;
    }
    .spinner {
      width: 50px;
      height: 50px;
      border: 4px solid rgba(245, 242, 233, 0.3);
      border-top: 4px solid #E5A385;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 20px;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <div id="loading-overlay">
    <div class="spinner"></div>
    <div id="loading-text">Loading Multi-Target Experience...</div>
  </div>

  <script>
    // ⚠️ UPDATE THIS to match your exact Firebase Storage bucket name
    const FIREBASE_BUCKET = "keeper-ar-storage.firebasestorage.app";

    async function initializeARScanner() {
      const loadingText = document.getElementById('loading-text');
      
      try {
        const urlParams = new URLSearchParams(window.location.search);
        const clientId = urlParams.get('client') || 'test-001';
        
        loadingText.innerText = `Loading profile for: ${clientId}...`;

        const configUrl = `https://firebasestorage.googleapis.com/v0/b/${FIREBASE_BUCKET}/o/clients%2F${clientId}%2Fconfig.json?alt=media`;
        const response = await fetch(configUrl);
        if (!response.ok) {
          throw new Error(`Could not find config.json for client "${clientId}" (Status: ${response.status})`);
        }
        
        const config = await response.json();
        console.log("Config loaded successfully:", config);

        const clientFolderPrefix = `https://firebasestorage.googleapis.com/v0/b/${FIREBASE_BUCKET}/o/clients%2F${config.clientId}%2F`;
        const mindFileUrl = clientFolderPrefix + "targets.mind?alt=media";

        loadingText.innerText = "Initializing Multi-Target Camera...";

        // Build scene dynamically using ALL targets in config.json
        buildAndInjectMultiScene(mindFileUrl, config.targets, clientFolderPrefix);

      } catch (error) {
        console.error("Initialization Error:", error);
        document.getElementById('loading-overlay').innerHTML = `
          <div style="text-align: center; padding: 20px;">
            <h3 style="color: #E5A385; margin-bottom: 10px;">Failed to Load Experience</h3>
            <p style="font-size: 14px; max-width: 300px;">${error.message}</p>
          </div>
        `;
      }
    }

    function buildAndInjectMultiScene(mindFileUrl, targets, clientFolderPrefix) {
      // 1. Build assets block dynamically for every video listed in config.json
      let assetsHTML = '<a-assets>';
      let entitiesHTML = '';

      targets.forEach((target, index) => {
        const videoUrl = clientFolderPrefix + target.videoUrl + "?alt=media";
        
        // Register each video asset with a unique ID
        assetsHTML += `
          <video 
            id="ar-video-${index}" 
            src="${videoUrl}" 
            preload="auto" 
            response-type="arraybuffer" 
            crossorigin="anonymous" 
            playsinline 
            webkit-playsinline 
            loop>
          </video>
        `;

        // Register each target index (0, 1, 2...) matching your compiled .mind file slots
        entitiesHTML += `
          <a-entity mindar-image-target="targetIndex: ${index}" id="target-entity-${index}">
            <a-video src="#ar-video-${index}" position="0 0 0" width="1" height="1.33" rotation="0 0 0"></a-video>
          </a-entity>
        `;
      });
      assetsHTML += '</a-assets>';

      // 2. Assemble the complete A-Frame scene
      const sceneHTML = `
        <a-scene 
          mindar-image="imageTargetSrc: ${mindFileUrl}; autoStart: true; uiScanning: yes;" 
          color-space="sRGB" 
          renderer="colorManagement: true, physicallyCorrectLights" 
          vr-mode-ui="enabled: false" 
          device-orientation-permission-ui="enabled: false">
          
          ${assetsHTML}

          <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

          ${entitiesHTML}
        </a-scene>
      `;

      document.body.insertAdjacentHTML('beforeend', sceneHTML);

      // 3. Remove loading screen once loaded
      const sceneEl = document.querySelector('a-scene');
      sceneEl.addEventListener('loaded', () => {
        const overlay = document.getElementById('loading-overlay');
        if (overlay) {
          overlay.style.opacity = '0';
          setTimeout(() => overlay.remove(), 500);
        }
      });

      // 4. Attach play/pause listeners to EACH target dynamically
      targets.forEach((_, index) => {
        const targetEntity = document.querySelector(`#target-entity-${index}`);
        const videoEl = document.querySelector(`#ar-video-${index}`);

        if (targetEntity && videoEl) {
          targetEntity.addEventListener('targetFound', () => {
            console.log(`Target ${index} found! Playing video.`);
            videoEl.play().catch(e => console.log(`Autoplay blocked on target ${index}:`, e));
          });

          targetEntity.addEventListener('targetLost', () => {
            console.log(`Target ${index} lost. Pausing video.`);
            videoEl.pause();
          });
        }
      });
    }

    window.addEventListener('DOMContentLoaded', initializeARScanner);
  </script>
</body>
</html>
