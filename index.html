<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Keeper AR Scanner</title>
  
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000;
      font-family: sans-serif;
    }
    #ui-instruction {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.75);
      color: #fff;
      padding: 12px 24px;
      border-radius: 24px;
      font-size: 14px;
      z-index: 999;
      pointer-events: none;
      text-align: center;
      max-width: 85vw;
    }
    #start-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: #1a1a1a;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      color: #fff;
      text-align: center;
      padding: 20px;
      box-sizing: border-box;
    }
    #start-button {
      background: #e5a385;
      color: #2d241e;
      border: none;
      padding: 14px 32px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 30px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div id="start-screen">
    <h1 style="color: #e5a385; font-family: serif;">Keeper Memories</h1>
    <p style="color: #ccc; font-size: 14px; margin-bottom: 25px;">Tap below to open your camera and bring your photos to life.</p>
    <button id="start-button" onclick="startApp()">Open AR Scanner</button>
  </div>

  <div id="ui-instruction" style="display: none;">Point your camera at your Keeper prints</div>

  <div id="scene-container"></div>

  <script>
    const STORAGE_BUCKET = "keeper-ar-storage.firebasestorage.app";

    function getFirebaseUrl(path) {
      return `https://firebasestorage.googleapis.com/v0/b/${STORAGE_BUCKET}/o/${encodeURIComponent(path)}?alt=media`;
    }

    async function startApp() {
      const urlParams = new URLSearchParams(window.location.search);
      const clientId = urlParams.get('client') || 'test-001';

      const configUrl = getFirebaseUrl(`clients/${clientId}/config.json`);
      const mindFileUrl = getFirebaseUrl(`clients/${clientId}/targets.mind`);

      let targets = [];
      try {
        const res = await fetch(configUrl);
        const config = await res.json();
        targets = config.targets || [];
      } catch (err) {
        console.error("Error loading config:", err);
        alert("Failed to load client config.json");
        return;
      }

      document.getElementById('start-screen').style.display = 'none';
      document.getElementById('ui-instruction').style.display = 'block';

      const container = document.getElementById('scene-container');
      
      let assetsHTML = '';
      let entitiesHTML = '';

      targets.forEach((t) => {
        const videoUrl = getFirebaseUrl(`clients/${clientId}/${t.videoUrl}`);
        
        assetsHTML += `
          <video id="vid-${t.targetIndex}" src="${videoUrl}" preload="auto" response-type="arraybuffer" crossorigin="anonymous" playsinline webkit-playsinline muted loop></video>
        `;

        entitiesHTML += `
          <a-entity mindar-image-target="targetIndex: ${t.targetIndex}" id="target-${t.targetIndex}">
            <a-video src="#vid-${t.targetIndex}" position="0 0 0" width="1" height="1.33" rotation="0 0 0"></a-video>
          </a-entity>
        `;
      });

      container.innerHTML = `
        <a-scene 
          mindar-image="imageTargetSrc: ${mindFileUrl}; autoStart: true; uiScanning: yes;" 
          color-space="sRGB" 
          renderer="colorManagement: true, physicallyCorrectLights" 
          vr-mode-ui="enabled: false" 
          device-orientation-permission-ui="enabled: false">
          
          <a-assets>
            ${assetsHTML}
          </a-assets>

          <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

          ${entitiesHTML}
        </a-scene>
      `;

      // Bind tracking events and video texture painting
      setTimeout(() => {
        const instruction = document.getElementById('ui-instruction');

        targets.forEach((t) => {
          const targetEl = document.querySelector(`#target-${t.targetIndex}`);
          const videoEl = document.querySelector(`#vid-${t.targetIndex}`);

          if (targetEl && videoEl) {
            targetEl.addEventListener('targetFound', () => {
              instruction.innerText = `Playing memory ${t.targetIndex + 1}...`;
              
              // Force reload texture state and play safely
              videoEl.currentTime = 0;
              videoEl.play().catch(err => {
                console.log("Playback retry:", err);
                videoEl.muted = true;
                videoEl.play();
              });
            });

            targetEl.addEventListener('targetLost', () => {
              instruction.innerText = "Point your camera at your Keeper prints";
              videoEl.pause();
            });
          }
        });
      }, 1500);
    }
  </script>
</body>
</html>
